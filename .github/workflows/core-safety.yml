name: Core safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-safety:
    name: Java 21 safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # This intentionally avoids floating action tags and guessed action SHAs.
      # The ephemeral read token is used for one exact-commit fetch and is not persisted.
      - name: Check out the exact workflow commit
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$GH_READ_TOKEN"
          authorization=$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\r\n')
          git init .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $authorization" \
            fetch --no-tags --depth=1 origin "$COMMIT_SHA"
          fetched=$(git rev-parse FETCH_HEAD)
          test "$fetched" = "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin

      # GitHub-hosted images provide Eclipse Temurin toolchains. Selecting the explicit
      # Java 21 home avoids an unpinned setup action or a network installer. Fail closed
      # if a future image removes that documented toolcache entry.
      - name: Select preinstalled Temurin 21
        shell: bash
        run: |
          set -euo pipefail
          java_home="${JAVA_HOME_21_X64:-${JAVA_HOME_21_ARM64:-}}"
          if [[ -z "$java_home" ]]; then
            echo "No preinstalled Java 21 toolchain was advertised by this runner." >&2
            exit 1
          fi
          case "$java_home" in
            [A-Za-z]:\\*) java_bin="${java_home}\\bin" ;;
            *) java_bin="${java_home}/bin" ;;
          esac
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s\n' "$java_bin" >> "$GITHUB_PATH"

      - name: Verify Temurin 21
        shell: bash
        run: |
          set -euo pipefail
          properties=$(java -XshowSettings:properties -version 2>&1)
          printf '%s\n' "$properties"
          grep -Eq 'java\.specification\.version = 21' <<< "$properties"
          grep -Eq 'java\.vendor = Eclipse Adoptium|java\.runtime\.name = .*Temurin' <<< "$properties"
          javac --version

      - name: Run core and platform safety tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/test-core.sh
          java -cp build/core-test/classes dev.agentconfig.workbench.PlatformSafetyTests
