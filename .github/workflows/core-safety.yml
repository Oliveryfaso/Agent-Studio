name: Core safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-safety:
    name: Java 21 safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      # This intentionally avoids floating action tags and guessed action SHAs.
      # The ephemeral read token is used for one exact-commit fetch and is not persisted.
      - name: Check out the exact workflow commit
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$GH_READ_TOKEN"
          authorization=$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\r\n')
          git init .
          git remote add origin "$SERVER_URL/$REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $authorization" \
            fetch --no-tags --depth=1 origin "$COMMIT_SHA"
          fetched=$(git rev-parse FETCH_HEAD)
          test "$fetched" = "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin

      - name: Set up Temurin 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Temurin 21
        shell: bash
        run: |
          set -euo pipefail
          properties=$(java -XshowSettings:properties -version 2>&1)
          printf '%s\n' "$properties"
          grep -Eq 'java\.specification\.version = 21' <<< "$properties"
          grep -Eq 'java\.vendor = Eclipse Adoptium|java\.runtime\.name = .*Temurin' <<< "$properties"
          javac --version

      - name: Run core and platform safety tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-core.sh
          java -cp build/core-test/classes dev.agentconfig.workbench.PlatformSafetyTests

      - name: Build the local Vue UI
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --prefix ui
          npm run build --prefix ui
